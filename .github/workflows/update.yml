name: Mise à jour des prix
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update.py
        env:
          PPT_KEY: ${{ secrets.PPT_KEY }}
          POKEMONTCG_KEY: ${{ secrets.POKEMONTCG_KEY }}
      - run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Prix du jour"
          git push
