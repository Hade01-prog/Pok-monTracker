<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi cartes Pokémon</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#eef1f4; --panel:#fff; --ink:#14202b; --mute:#5d6b78; --line:#d9dfe5; --accent:#0e7c86; --up:#1b7f4b; --down:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10161c; --panel:#18212a; --ink:#e8edf2; --mute:#97a5b2; --line:#2a3642; --accent:#4cc3cd; --up:#5fd08e; --down:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--mute); margin: 0 0 20px; font-size: .9rem; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:8px 16px; border-radius:999px; font:inherit; cursor:pointer; }
  .tabs button[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mute); font-weight:600; font-size:.85rem; }
  tr:last-child td { border-bottom:0; }
  tbody tr { cursor:pointer; }
  tbody tr:hover, tbody tr.sel { background:color-mix(in srgb, var(--accent) 10%, transparent); }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); }
  .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid currentColor; margin-left:8px; }
  .chart { margin-top:16px; padding:16px; display:none; }
  .chart h2 { font-size:1rem; margin:0 0 8px; }
  .empty { padding:24px; color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Suivi des cartes Pokémon</h1>
  <p class="sub" id="meta">Chargement…</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-raw" aria-selected="true">Non gradées</button>
    <button role="tab" id="t-graded" aria-selected="false">Gradées</button>
  </div>
  <div class="panel"><div id="list"></div></div>
  <div class="panel chart" id="chartBox"><h2 id="chartTitle"></h2><canvas id="chart" height="120"></canvas></div>
</main>
<script>
const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const dateFr = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
let items = [], kind = "raw", chart = null, selected = null;

function stats(it) {
  const s = it.series, last = s[s.length - 1];
  const limit = new Date(last[0]); limit.setDate(limit.getDate() - 7);
  const ref = [...s].reverse().find(p => new Date(p[0]) <= limit) || s[0];
  const pct = ref[1] ? (last[1] - ref[1]) / ref[1] * 100 : 0;
  const alert = it.below != null && last[1] <= it.below ? "Sous le seuil"
              : it.above != null && last[1] >= it.above ? "Au-dessus du seuil" : "";
  return { price: last[1], date: last[0], pct, alert, days: s.length };
}

function render() {
  const rows = items.filter(i => i.kind === kind);
  const list = document.getElementById("list");
  if (!rows.length) {
    list.innerHTML = '<p class="empty">Aucune donnée pour le moment. Dans GitHub, ouvre l\'onglet Actions, choisis « Mise à jour des prix » et clique sur Run workflow.</p>';
    return;
  }
  list.innerHTML = "<table><thead><tr><th>Carte</th><th class='num'>Prix</th><th class='num'>7 jours</th></tr></thead><tbody>" +
    rows.map(i => {
      const s = stats(i);
      const cls = s.pct > 0.05 ? "up" : s.pct < -0.05 ? "down" : "";
      const sign = s.pct > 0 ? "+" : "";
      return `<tr data-key="${i.key}" class="${i.key === selected ? "sel" : ""}" tabindex="0">
        <td>${i.label}${s.alert ? `<span class="badge ${s.alert.startsWith("Sous") ? "down" : "up"}">${s.alert}</span>` : ""}</td>
        <td class="num">${eur.format(s.price)}</td>
        <td class="num ${cls}">${s.days > 1 ? sign + s.pct.toFixed(1) + " %" : "–"}</td></tr>`;
    }).join("") + "</tbody></table>";
  list.querySelectorAll("tbody tr").forEach(tr => {
    const open = () => { selected = tr.dataset.key; render(); draw(); };
    tr.addEventListener("click", open);
    tr.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
  });
}

function draw() {
  const it = items.find(i => i.key === selected);
  const box = document.getElementById("chartBox");
  if (!it) { box.style.display = "none"; return; }
  box.style.display = "block";
  document.getElementById("chartTitle").textContent = it.label;
  if (chart) chart.destroy();
  const css = getComputedStyle(document.documentElement);
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels: it.series.map(p => dateFr(p[0])), datasets: [{ data: it.series.map(p => p[1]),
      borderColor: css.getPropertyValue("--accent"), tension: .25, pointRadius: 3 }] },
    options: { plugins: { legend: { display: false } },
      scales: { y: { ticks: { callback: v => eur.format(v) } } } }
  });
}

function setKind(k) {
  kind = k; selected = null;
  document.getElementById("t-raw").setAttribute("aria-selected", k === "raw");
  document.getElementById("t-graded").setAttribute("aria-selected", k === "graded");
  render(); draw();
}
document.getElementById("t-raw").onclick = () => setKind("raw");
document.getElementById("t-graded").onclick = () => setKind("graded");

fetch("data/history.json?" + Date.now()).then(r => r.json()).then(h => {
  items = Object.entries(h.items || {}).filter(([, v]) => v.series && v.series.length)
    .map(([key, v]) => ({ key, ...v }));
  const last = items.flatMap(i => i.series.map(p => p[0])).sort().pop();
  document.getElementById("meta").textContent = last
    ? "Dernière mise à jour : " + dateFr(last) + ". Les prix gradés sont des dollars convertis en euros."
    : "Pas encore de données.";
  render();
}).catch(() => {
  document.getElementById("meta").textContent = "Impossible de lire data/history.json.";
});
</script>
</body>
</html>
